[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/video",
    "crates/settings",
    "crates/filters",
    "crates/transitions",
    "crates/scenes",
    "crates/audio",
    "crates/platform-windows",
    "crates/capture",
    "crates/sources",
    "crates/renderer",
    "crates/encoder",
    "crates/recorder",
    "crates/streamer",
    "crates/plugins",
    "crates/websocket",
    "crates/ui",
    "crates/app",
    "plugins/sample-vignette-plugin",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"

[workspace.dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
egui = "0.31.1"
egui_dock = { version = "0.16.0", features = ["serde"] }
egui-wgpu = "0.31.1"
wgpu = "24.0.1"
windows = "0.58.0"
windows-core = "0.58.0"
tokio = { version = "1.44", features = ["full"] }
tokio-tungstenite = "0.26"
tokio-native-tls = "0.3"
native-tls = "0.2"
rml_rtmp = "0.8.0"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
bytemuck = { version = "1.21", features = ["derive"] }
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tga", "ico"] }
fontdue = "0.9"
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1.12", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6.0"
rfd = "0.15"
libloading = "0.8"
thiserror = "2.0"
bytes = "1.10"
rand = "0.8"
url = "2.5"
pollster = "0.4"

# Internal workspace crates
obs-core = { path = "crates/core" }
obs-video = { path = "crates/video" }
obs-settings = { path = "crates/settings" }
obs-filters = { path = "crates/filters" }
obs-transitions = { path = "crates/transitions" }
obs-scenes = { path = "crates/scenes" }
obs-audio = { path = "crates/audio" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
